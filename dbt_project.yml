name: 'my_new_project'
version: '1.0.0'
config-version: 2

# ✅ Profile (connects to Snowflake)
profile: 'default'

# ✅ Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ✅ Model configuration (layered architecture)
models:
  my_new_project:

    # 🔹 Staging layer
    staging:
      +materialized: view
      +schema: staging

    # 🔹 Intermediate layer
    intermediate:
      +materialized: view
      +schema: intermediate

    # 🔹 Mart layer (future use)
    marts:
      +materialized: table
      +schema: marts

    # 🔹 Disable default example models
    example:
      +enabled: false

# ✅ Seeds configuration (for nations.csv)
seeds:
  my_new_project:
    +schema: seed_data
    +quote_columns: false