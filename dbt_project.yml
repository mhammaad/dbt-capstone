name: 'dbt_capstone'
version: '1.0.0'
config-version: 2

# ✅ Profile (connects to Snowflake)
profile: 'default'

# ✅ Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# ✅ Model configuration (layered architecture)
models:
  dbt_capstone:

    # 🔹 Staging layer
    staging:
      +materialized: view
      +schema: staging

    # 🔹 Intermediate layer
    intermediate:
      +materialized: view
      +schema: intermediate

    # 🔹 Mart layer
    marts:
      +materialized: table
      +schema: marts

    # 🔹 Disable default example models
    example:
      +enabled: false

# ✅ Seeds configuration
seeds:
  dbt_capstone:
    +schema: seed_data
    +quote_columns: false