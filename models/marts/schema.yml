version: 2

models:
  # ✅ FACT TABLE
  - name: fct_orders
    description: "{{ doc('__overview__') }}"

    columns:
      - name: order_sk
        description: "Surrogate key"
        tests:
          - not_null
          - unique

      - name: order_key
        description: "Business key"
        tests:
          - not_null

      - name: customer_key
        description: "FK to customer"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key

      - name: order_status
        description: "Order status"
        tests:
          - accepted_values:
              values: ['O', 'F', 'P']

  # ✅ DIMENSION TABLE
  - name: dim_customers
    description: "Customer dimension"

    columns:
      - name: customer_key
        description: "Primary key"
        tests:
          - not_null
          - unique

      - name: customer_tier
        description: "Customer segmentation tier"
        tests:
          - accepted_values:
              values: ['Platinum', 'Gold', 'Silver', 'Bronze']

      - name: nation_key
        description: "FK to nations"
        tests:
          - relationships:
              to: ref('stg_tpch__nations')
              field: nation_key